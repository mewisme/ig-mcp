# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: ig-mcp

builds:
  - id: ig-mcp
    main: .
    binary: ig-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: ig-mcp-archives
    ids:
      - ig-mcp
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md
      - .env.example
      - LICENSE
      - NOTICE

source:
  enabled: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git
  sort: asc